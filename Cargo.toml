[workspace]
members = [".", "test-fixtures/mock-claude"]

[package]
name = "claude-print"
version = "0.2.2"
edition = "2021"
rust-version = "1.82"
description = "Drop-in replacement for `claude -p` that bills against the subscription pool via PTY"
license = "MIT"

[[bin]]
name = "claude-print"
path = "src/main.rs"

# The mock-claude fixture, built as a bin of THIS package so every `cargo test`
# invocation (plain or filtered, local or CI) links it into
# `target/<profile>/mock-claude` — exactly where the integration tests resolve
# it. build.rs used to shell out to a nested `cargo build` for this, but cargo
# only sets CARGO_PRIMARY_PACKAGE for explicit `-p` selections, so that nested
# build was silently skipped on every plain `cargo test` (claudepr-2c965921),
# and when it did run it blocked on the outer build's target-dir lock.
# `test-fixtures/mock-claude` stays a workspace member because CI's build-musl
# step builds it via `--manifest-path` for the release asset; both entries
# produce the same output path, so the only way to hit a duplicate-bin error is
# a `--workspace` build that includes both — nothing in CI or the documented
# build commands does that.
[[bin]]
name = "mock-claude"
path = "test-fixtures/mock-claude/src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive", "env"] }
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "0.8.22"
nix = { version = "0.29", features = ["process", "signal", "fs", "ioctl", "term"] }
tempfile = "3.20"
libc = "0.2"
atty = "0.2"
which = "7.0"
uuid = { version = "1.18", features = ["v4"] }

# Dev/test builds carry line-tables-only debuginfo, not full DWARF
# (claudepr-1a49ba70). Measured 2026-09-24, cold build with a fresh target
# dir: 35 integration-test binaries each link the whole crate, and before
# this setting ~79% of every test binary was .debug_* sections —
# target/debug/deps alone was ~1.14 GiB per build generation. Line tables
# keep panic/backtrace file:line frames; what is dropped is variable- and
# type-level DWARF. A lane that genuinely needs full DWARF can opt back in
# for that invocation only: CARGO_PROFILE_DEV_DEBUG=2 (verified: no
# gdb/lldb/valgrind/llvm-cov/perf/heaptrack use anywhere in this repo's
# scripts, docs, or CI as of 2026-09-24). [profile.test] has no `debug` of
# its own and inherits this; [profile.release] / [profile.release-musl] are
# untouched.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-musl]
inherits = "release"
