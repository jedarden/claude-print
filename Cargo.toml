[package]
name = "claude-print"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Drop-in replacement for `claude -p` that bills against the subscription pool via PTY"
license = "MIT"

[[bin]]
name = "claude-print"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive", "env"] }
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "0.8.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-musl]
inherits = "release"
