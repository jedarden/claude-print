apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: claude-print-ci
  namespace: argo-workflows
  labels:
    app: claude-print-ci
spec:
  # Limit to one concurrent run per repo -- repeated pushes queue instead
  # of running N concurrent workflows that compete for iad-ci's limited
  # capacity (15 allocatable CPU across 6 nodes). Matches the pattern
  # already proven on needle-ci (see needle-ci-semaphore-configmap.yml).
  synchronization:
    mutexes:
      - name: claude-print-ci
  # Backstop against a run that hangs before its pod ever starts (unbound
  # PVC, unschedulable, missing secret). Per-step activeDeadlineSeconds does
  # not cover that case: on 2026-08-07 five needle-ci runs sat Running for
  # 8h against a 3600s step limit. ttlStrategy only reaps COMPLETED runs, so
  # without a workflow-level cap they are never terminated and never GCd.
  # Basis: sum of per-step deadlines x attempts = 3600s, +50% headroom.
  activeDeadlineSeconds: 7200
  entrypoint: ci
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: tag
        value: ""  # Empty = verify-only mode (build from main); set to "vX.Y.Z" for release
  templates:
    - name: ci
      activeDeadlineSeconds: 3600
      inputs:
        parameters:
          - name: tag
            value: "{{workflow.parameters.tag}}"
      container:
        image: debian:bookworm
        command: [bash, -c]
        args:
          - |
            set -ex

            TAG="{{inputs.parameters.tag}}"

            # System dependencies
            apt-get update && apt-get install -y \
              git curl build-essential pkg-config libssl-dev

            # Install gh CLI
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh

            # Install Rust stable + components/targets/tooling
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile default
            . "$HOME/.cargo/env"
            rustc --version
            # fmt + clippy gates (profile default installs them; add explicitly to be safe)
            rustup component add rustfmt clippy
            # musl static target — required by HR-1 (single statically-linked binary)
            rustup target add x86_64-unknown-linux-musl
            # cargo audit gate (RustSec advisory DB check)
            cargo install cargo-audit

            # Clone from trusted hardcoded source (ignore webhook payload)
            # Use --no-tags to avoid fetching all tags; fetch specific tag if needed
            if [ -n "$TAG" ]; then
              echo "Release mode: building from tag $TAG"
              git clone --depth 1 --branch "$TAG" --single-branch \
                "https://github.com/jedarden/claude-print.git" /workspace
            else
              echo "Verify-only mode: building from main"
              git clone --depth 1 \
                "https://github.com/jedarden/claude-print.git" /workspace
            fi
            cd /workspace

            COMMIT=$(git rev-parse HEAD)

            # Extract version from Cargo.toml
            VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)".*/\1/')
            echo "Building claude-print v${VERSION} (commit: ${COMMIT})"

            # === Quality gates — run on EVERY CI invocation; fail fast on error ===
            # Per plan "Definition of Done" / all-gates policy: every commit that
            # reaches the CI step MUST pass fmt + clippy + test + audit simultaneously.

            echo "Running cargo fmt --check..."
            cargo fmt --check
            echo "fmt OK"

            echo "Running cargo clippy --all-targets -- -D warnings..."
            cargo clippy --all-targets -- -D warnings
            echo "clippy OK"

            # Run tests (including watchdog regression tests)
            echo "Running test suite..."
            cargo test --verbose
            echo "Tests passed successfully"

            echo "Running cargo audit..."
            cargo audit
            echo "audit OK (no known vulnerabilities)"

            # In verify-only mode (TAG empty), skip release creation after quality gates
            if [ -z "$TAG" ]; then
              echo "Verify-only mode: all quality gates passed, exiting without release"
              exit 0
            fi

            # Tag-to-Forgejo (draft-revert root-cause fix, 2026-08-16): the
            # GitHub repo is a Forgejo push mirror, and every mirror sync
            # PRUNES refs that exist only on GitHub. GitHub demotes a
            # published release to draft when its tag is deleted, so the tag
            # must exist on Forgejo BEFORE any GitHub release references it.
            git tag "v${VERSION}" 2>/dev/null || [ "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$(git rev-parse HEAD)" ]
            echo "Pushing tag v${VERSION} to Forgejo"
            set +x
            git push "https://x-token:${FORGEJO_TOKEN}@git.ardenone.com/jedarden/claude-print.git" "refs/tags/v${VERSION}"
            set -x

            # Skip only if the version is genuinely PUBLISHED (not a draft) —
            # a drafted release must be published in place, not skipped.
            IS_DRAFT=$(gh release view "v${VERSION}" --repo jedarden/claude-print --json isDraft --jq '.isDraft' 2>/dev/null || echo "absent")
            if [ "$IS_DRAFT" = "false" ]; then
              echo "Release v${VERSION} already published — skipping"
              exit 0
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release v${VERSION} exists as a DRAFT — publishing it in place"
              gh release edit "v${VERSION}" --repo jedarden/claude-print --draft=false
              echo "Release v${VERSION} published"
              exit 0
            fi

            ARCH=$(uname -m)
            TARGET="${ARCH}-linux"
            MUSL_TARGET="${ARCH}-unknown-linux-musl"

            # Build claude-print as a STATIC musl binary (HR-1: no shared lib deps).
            cargo build --release --target "${MUSL_TARGET}" --bin claude-print
            CLAUDE_PRINT_ASSET="claude-print-${TARGET}"
            cp "./target/${MUSL_TARGET}/release/claude-print" "${CLAUDE_PRINT_ASSET}"

            # Build mock_claude (workspace member) as a static musl binary too.
            cargo build --release --target "${MUSL_TARGET}" --manifest-path test-fixtures/mock-claude/Cargo.toml
            MOCK_ASSET="mock_claude-${TARGET}"
            cp "./target/${MUSL_TARGET}/release/mock-claude" "${MOCK_ASSET}"

            # Verify both binaries are statically linked (HR-1 enforcement).
            # NOTE: ldd exits 0 for BOTH static and dynamic binaries, so we check
            # its stdout/stderr for the "statically linked" / "not a dynamic
            # executable" marker rather than trusting the exit status.
            verify_static() {
              local out
              out="$(ldd "$1" 2>&1 || true)"
              echo "ldd $1:"; echo "${out}"
              if echo "${out}" | grep -qE 'statically linked|not a dynamic executable'; then
                echo "OK: $1 is statically linked"
              else
                echo "ERROR: $1 is NOT statically linked — violates HR-1" >&2
                exit 1
              fi
            }
            verify_static "./${CLAUDE_PRINT_ASSET}"
            verify_static "./${MOCK_ASSET}"

            # Enforce the plan's <10 MiB binary-size requirement.
            BINARY_SIZE_BYTES=$(stat -c%s "./${CLAUDE_PRINT_ASSET}")
            MAX_SIZE_BYTES=$((10 * 1024 * 1024))
            echo "Binary size: ${BINARY_SIZE_BYTES} bytes (max: ${MAX_SIZE_BYTES} bytes)"
            if [ "$BINARY_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
              echo "ERROR: Binary size ${BINARY_SIZE_BYTES} bytes exceeds ${MAX_SIZE_BYTES} byte limit" >&2
              exit 1
            fi

            # Record the wrapped Claude version when available. The release
            # image does not currently install Claude, so retain an explicit
            # unknown marker rather than omitting the artifact.
            if CLAUDE_BIN=$(command -v claude 2>/dev/null); then
              CLAUDE_VERSION_OUTPUT=$("$CLAUDE_BIN" --version 2>&1)
              echo "$CLAUDE_VERSION_OUTPUT" > last-claude-version.txt
              echo "Recorded Claude version: $CLAUDE_VERSION_OUTPUT"
            else
              echo "WARNING: claude binary not found on PATH; recording unknown" >&2
              echo "unknown" > last-claude-version.txt
            fi

            # Create GitHub release with both binaries and the version artifact
            gh release create "v${VERSION}" \
              --repo jedarden/claude-print \
              --title "claude-print v${VERSION}" \
              --notes "Release v${VERSION}

            Built from commit: ${COMMIT}

            ## Installation

            \`\`\`sh
            sh <(curl -fsSL https://raw.githubusercontent.com/jedarden/claude-print/main/install.sh)
            \`\`\`

            ## Assets

            - \`claude-print-${TARGET}\` — main binary
            - \`mock_claude-${TARGET}\` — test fixture binary
            - \`last-claude-version.txt\` — Claude version this release was built and tested against
            " \
              --target main \
              "./${CLAUDE_PRINT_ASSET}" \
              "./${MOCK_ASSET}" \
              "./last-claude-version.txt"

            echo "Release v${VERSION} created successfully"
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-access-token" && echo "password=$GH_TOKEN"; }; f'
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 3500m
            memory: 6Gi
