apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: claude-print-ci
  namespace: argo-workflows
  labels:
    app: claude-print-ci
spec:
  entrypoint: ci
  serviceAccountName: argo-workflow
  templates:
    - name: ci
      activeDeadlineSeconds: 3600
      container:
        image: debian:bookworm
        command: [bash, -c]
        args:
          - |
            set -ex

            # System dependencies
            apt-get update && apt-get install -y \
              git curl build-essential pkg-config libssl-dev

            # Install gh CLI
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh

            # Install Rust stable + components/targets/tooling
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile default
            . "$HOME/.cargo/env"
            rustc --version
            # fmt + clippy gates (profile default installs them; add explicitly to be safe)
            rustup component add rustfmt clippy
            # musl static target — required by HR-1 (single statically-linked binary)
            rustup target add x86_64-unknown-linux-musl
            # cargo audit gate (RustSec advisory DB check)
            cargo install cargo-audit

            # Clone from trusted hardcoded source (ignore webhook payload)
            git clone --depth 1 \
              "https://github.com/jedarden/claude-print.git" \
              /workspace
            cd /workspace

            COMMIT=$(git rev-parse HEAD)

            # Extract version from Cargo.toml
            VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)".*/\1/')
            echo "Building claude-print v${VERSION} (commit: ${COMMIT})"

            # === Quality gates — run on EVERY CI invocation; fail fast on error ===
            # Per plan "Definition of Done" / all-gates policy: every commit that
            # reaches the CI step MUST pass fmt + clippy + test + audit simultaneously.

            echo "Running cargo fmt --check..."
            cargo fmt --check
            echo "fmt OK"

            echo "Running cargo clippy --all-targets -- -D warnings..."
            cargo clippy --all-targets -- -D warnings
            echo "clippy OK"

            # Run tests (including watchdog regression tests)
            echo "Running test suite..."
            cargo test --verbose
            echo "Tests passed successfully"

            echo "Running cargo audit..."
            cargo audit
            echo "audit OK (no known vulnerabilities)"

            # Check if release already exists — idempotent re-runs safe
            if gh release view "v${VERSION}" --repo jedarden/claude-print > /dev/null 2>&1; then
              echo "Release v${VERSION} already exists — skipping"
              exit 0
            fi

            ARCH=$(uname -m)
            TARGET="${ARCH}-linux"
            MUSL_TARGET="${ARCH}-unknown-linux-musl"

            # Build claude-print as a STATIC musl binary (HR-1: no shared lib deps).
            cargo build --release --target "${MUSL_TARGET}" --bin claude-print
            CLAUDE_PRINT_ASSET="claude-print-${TARGET}"
            cp "./target/${MUSL_TARGET}/release/claude-print" "${CLAUDE_PRINT_ASSET}"

            # Build mock_claude (workspace member) as a static musl binary too.
            cargo build --release --target "${MUSL_TARGET}" --manifest-path test-fixtures/mock-claude/Cargo.toml
            MOCK_ASSET="mock_claude-${TARGET}"
            cp "./target/${MUSL_TARGET}/release/mock-claude" "${MOCK_ASSET}"

            # Verify both binaries are statically linked (HR-1 enforcement).
            # NOTE: ldd exits 0 for BOTH static and dynamic binaries, so we check
            # its stdout/stderr for the "statically linked" / "not a dynamic
            # executable" marker rather than trusting the exit status.
            verify_static() {
              local out
              out="$(ldd "$1" 2>&1 || true)"
              echo "ldd $1:"; echo "${out}"
              if echo "${out}" | grep -qE 'statically linked|not a dynamic executable'; then
                echo "OK: $1 is statically linked"
              else
                echo "ERROR: $1 is NOT statically linked — violates HR-1" >&2
                exit 1
              fi
            }
            verify_static "./${CLAUDE_PRINT_ASSET}"
            verify_static "./${MOCK_ASSET}"

            # Create GitHub release with both binaries
            gh release create "v${VERSION}" \
              --repo jedarden/claude-print \
              --title "claude-print v${VERSION}" \
              --notes "Release v${VERSION}

            Built from commit: ${COMMIT}

            ## Installation

            \`\`\`sh
            sh <(curl -fsSL https://raw.githubusercontent.com/jedarden/claude-print/main/install.sh)
            \`\`\`

            ## Assets

            - \`claude-print-${TARGET}\` — main binary
            - \`mock_claude-${TARGET}\` — test fixture binary
            " \
              --target main \
              "./${CLAUDE_PRINT_ASSET}" \
              "./${MOCK_ASSET}"

            echo "Release v${VERSION} created successfully"
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-access-token" && echo "password=$GH_TOKEN"; }; f'
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
